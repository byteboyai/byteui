[package]
name = "byteui"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "ByteBoy 系产品共用的 iced 0.14 UI 组件库"
repository = "https://github.com/byteboyai/byteui"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced_widget = { version = "0.14", features = ["svg", "canvas"] }
iced_renderer = "0.14"
iced_futures = { version = "0.14", features = ["tokio"] }

[dev-dependencies]
iced = { version = "0.14", features = ["svg", "canvas"] }
tempfile = "3"
